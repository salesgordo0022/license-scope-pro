project_id = "nxpblhykcakrdcnnzyyg"
# Chamadas vindas do Slack e do ZapContábil (sem usuário logado). A segurança é
# a assinatura do Slack e o token na URL do webhook, verificados nas próprias functions.
[functions.slack-eventos]
verify_jwt = false

[functions.zapcontabil-webhook]
verify_jwt = false

# Retorno do OAuth do Slack (GET sem login). O "iniciar" exige login e é
# verificado dentro da function.
[functions.slack-oauth]
verify_jwt = false

# Sincronização do ZapContábil: chamada pelo pg_cron (token da empresa na URL)
# ou pelo botão da tela (usuário logado, verificado dentro da function).
[functions.zapcontabil-sincronizar]
verify_jwt = false

# Envios agendados: chamada pelo pg_cron (token na URL) e pela tela (usuário
# logado, verificado dentro da function).
[functions.envios-agendados]
verify_jwt = false

# IA do atendimento: chamada pelo trigger do banco (token na URL) e pela tela
# (usuário logado, verificado dentro da function).
[functions.ia-atendimento]
verify_jwt = false
